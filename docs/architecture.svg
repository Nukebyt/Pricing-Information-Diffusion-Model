<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="740" fill="#ffffff"/>

  <!-- event_calendar.py -->
  <rect x="280" y="20" width="340" height="72" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="46" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">event_calendar.py</text>
  <text x="450" y="65" text-anchor="middle" font-size="11" fill="#475569">RBI MPC / Union Budget / CPI — WebSearch-verified</text>
  <text x="450" y="80" text-anchor="middle" font-size="11" fill="#475569">dates + timing_confidence + market_hours flag</text>

  <line x1="450" y1="92" x2="450" y2="130" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="465" y="115" font-size="10.5" font-style="italic" fill="#64748b">drives capture window</text>

  <!-- tick_recorder.py outer -->
  <rect x="130" y="130" width="640" height="172" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="153" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">tick_recorder.py</text>

  <!-- market-hours path -->
  <rect x="150" y="168" width="290" height="118" rx="6" fill="#eef2f7" stroke="#94a3b8" stroke-width="1"/>
  <text x="295" y="188" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">Market-hours event (RBI / Budget)</text>
  <text x="295" y="207" text-anchor="middle" font-size="11" fill="#475569">auth.py → reference_table.py</text>
  <text x="295" y="224" text-anchor="middle" font-size="11" fill="#475569">→ WebSocket connect → subscribe</text>
  <text x="295" y="241" text-anchor="middle" font-size="11" fill="#475569">→ feed_to_tick_row() decodes</text>
  <text x="295" y="258" text-anchor="middle" font-size="11" fill="#475569">every protobuf tick</text>

  <!-- after-hours path -->
  <rect x="460" y="168" width="290" height="118" rx="6" fill="#eef2f7" stroke="#94a3b8" stroke-width="1"/>
  <text x="605" y="188" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">After-hours event (CPI)</text>
  <text x="605" y="207" text-anchor="middle" font-size="11" fill="#475569">record_gap_tick() → REST snapshot</text>
  <text x="605" y="227" text-anchor="middle" font-size="11" fill="#475569">3 named points:</text>
  <text x="605" y="244" text-anchor="middle" font-size="11" fill="#475569">pre_close / post_open /</text>
  <text x="605" y="261" text-anchor="middle" font-size="11" fill="#475569">post_open_settled</text>

  <line x1="450" y1="302" x2="450" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="463" y="325" font-size="10.5" font-style="italic" fill="#64748b">writes</text>

  <!-- diffusion_db.py -->
  <rect x="320" y="340" width="260" height="62" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="365" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">diffusion_db.py</text>
  <text x="450" y="384" text-anchor="middle" font-size="11" fill="#475569">data/diffusion_ticks.db — SQLite, per-event ticks</text>

  <!-- fan-out arrows to analysis layer -->
  <line x1="450" y1="402" x2="450" y2="422" stroke="#64748b" stroke-width="1.5"/>
  <text x="463" y="418" font-size="10.5" font-style="italic" fill="#64748b">read back for analysis</text>
  <line x1="450" y1="422" x2="170" y2="422" stroke="#64748b" stroke-width="1.5"/>
  <line x1="450" y1="422" x2="450" y2="422" stroke="#64748b" stroke-width="1.5"/>
  <line x1="450" y1="422" x2="730" y2="422" stroke="#64748b" stroke-width="1.5"/>
  <line x1="170" y1="422" x2="170" y2="440" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="422" x2="450" y2="440" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="422" x2="730" y2="440" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- three analysis modules -->
  <rect x="40" y="440" width="260" height="140" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
  <text x="170" y="463" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">lag_detection.py</text>
  <text x="170" y="483" text-anchor="middle" font-size="11" fill="#475569">first-move detection +</text>
  <text x="170" y="500" text-anchor="middle" font-size="11" fill="#475569">lead_lag_seconds() primitive</text>
  <text x="170" y="521" text-anchor="middle" font-size="11" fill="#475569">2 angles: spot-vs-option,</text>
  <text x="170" y="538" text-anchor="middle" font-size="11" fill="#475569">NIFTY-vs-BANKNIFTY</text>
  <text x="170" y="559" text-anchor="middle" font-size="11" fill="#475569">cross-index</text>

  <rect x="320" y="440" width="260" height="140" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="463" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">adjustment_curves.py</text>
  <text x="450" y="486" text-anchor="middle" font-size="11" fill="#475569">settle-speed</text>
  <text x="450" y="503" text-anchor="middle" font-size="11" fill="#475569">(time-to-90%-adjustment)</text>
  <text x="450" y="524" text-anchor="middle" font-size="11" fill="#475569">+ normalized price paths</text>
  <text x="450" y="541" text-anchor="middle" font-size="11" fill="#475569">for the chart below</text>

  <rect x="600" y="440" width="260" height="140" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
  <text x="730" y="463" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">gap_diffusion.py</text>
  <text x="730" y="486" text-anchor="middle" font-size="11" fill="#475569">overnight-gap breakdown</text>
  <text x="730" y="503" text-anchor="middle" font-size="11" fill="#475569">for after-hours (CPI) events —</text>
  <text x="730" y="524" text-anchor="middle" font-size="11" fill="#475569">gap fraction vs. followthrough</text>
  <text x="730" y="541" text-anchor="middle" font-size="11" fill="#475569">fraction (not clamped, see BUGS.md)</text>

  <!-- converge to charts.py -->
  <line x1="170" y1="580" x2="170" y2="600" stroke="#64748b" stroke-width="1.5"/>
  <line x1="450" y1="580" x2="450" y2="600" stroke="#64748b" stroke-width="1.5"/>
  <line x1="730" y1="580" x2="730" y2="600" stroke="#64748b" stroke-width="1.5"/>
  <line x1="170" y1="600" x2="730" y2="600" stroke="#64748b" stroke-width="1.5"/>
  <line x1="450" y1="600" x2="450" y2="640" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- charts.py -->
  <rect x="320" y="640" width="260" height="62" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="666" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">charts.py</text>
  <text x="450" y="685" text-anchor="middle" font-size="11" fill="#475569">diffusion-timeline PNGs</text>
</svg>
